name: Vercel Deploy + KV

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Vercel CLI
        run: npm i -g vercel

      - name: Linkar projeto
        run: |
          if [ -n "$VERCEL_SCOPE" ]; then
            vercel link --yes --token="$VERCEL_TOKEN" --project=castellorecepcao --scope="$VERCEL_SCOPE"
          else
            vercel link --yes --token="$VERCEL_TOKEN" --project=castellorecepcao
          fi

      - name: Criar e vincular Vercel KV
        run: |
          vercel kv create castello-kv --yes --token="$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope="$VERCEL_SCOPE"} || true
          vercel env pull .env.local --token="$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope="$VERCEL_SCOPE"} || true
          if grep -q 'KV_REST_API_URL' .env.local 2>/dev/null; then
            vercel env add KV_REST_API_URL "$(grep '^KV_REST_API_URL=' .env.local | cut -d= -f2-)" -t production -t preview -t development --token="$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope="$VERCEL_SCOPE"} || true
            vercel env add KV_REST_API_TOKEN "$(grep '^KV_REST_API_TOKEN=' .env.local | cut -d= -f2-)" -t production -t preview -t development --token="$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope="$VERCEL_SCOPE"} || true
            echo "KV vinculado: variaveis adicionadas ao projeto."
          else
            echo "AVISO: variaveis do KV nao apareceram apos criar. Vincule manualmente no dashboard (Storage -> castello-kv -> connect)."
          fi

      - name: Verificar vinculo do KV no projeto
        run: |
          echo "Variaveis de ambiente do projeto (devem conter KV_REST_API_URL e KV_REST_API_TOKEN):"
          vercel env ls --token="$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope="$VERCEL_SCOPE"} || true

      - name: Deploy em produção
        run: |
          if [ -n "$VERCEL_SCOPE" ]; then
            vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          else
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          fi
